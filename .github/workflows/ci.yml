name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout astrowidget sibling
        run:
          git clone --depth 1 --branch main
          https://github.com/ovro-lwa/astrowidget.git ../astrowidget

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.63.2
          cache: true
          frozen: true
          environments: default

      - name: Run pre-commit checks
        run: pixi run pre-commit-all

  tests:
    name: Test Python 3.12 on ubuntu-latest
    runs-on: ubuntu-latest
    needs: [pre-commit]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout astrowidget sibling
        run:
          git clone --depth 1 --branch main
          https://github.com/ovro-lwa/astrowidget.git ../astrowidget

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.63.2
          cache: true
          frozen: true
          environments: default

      - name: Install dependencies
        run: pixi install --frozen

      - name: Run tests
        run: |
          pixi run pytest tests/ -ra --cov=ovro_lwa_portal \
            --cov-report=xml --cov-report=term --durations=20

      - name: Upload coverage report
        uses: codecov/codecov-action@v5.3.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
